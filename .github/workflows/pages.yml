name: Refresh and publish Cirque Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push'
      - name: Refresh official catalogue
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run refresh
      - name: Record refresh failure
        if: steps.refresh.outcome == 'failure'
        run: echo 'Refresh failed. Publishing last validated snapshot with its original timestamp.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
      - name: Save successful refreshed snapshot
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official Cirque show and offer snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
